name: Package Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Prerelease package version
        required: true
        default: 0.1.0-alpha.1
        type: string
      publish:
        description: Publish packages to NuGet.org
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate version
        shell: bash
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
            echo "Version must be a prerelease SemVer value, for example 0.1.0-alpha.1." >&2
            exit 1
          fi

      - name: Restore
        run: dotnet restore Auxim.Kernel.sln

      - name: Build
        run: dotnet build Auxim.Kernel.sln --no-restore -c Release -p:Version=${{ inputs.version }}

      - name: Test
        run: dotnet test Auxim.Kernel.sln --no-build -c Release -p:Version=${{ inputs.version }} --verbosity normal

      - name: Pack
        run: dotnet pack src/Auxim.Kernel.Package/Auxim.Kernel.Package.csproj --no-build -c Release -p:Version=${{ inputs.version }} -o artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: auxim-kernel-${{ inputs.version }}
          path: artifacts/packages/Auxim.Kernel.*.nupkg
          if-no-files-found: error

      - name: Require NuGet API key
        if: ${{ inputs.publish }}
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [[ -z "$NUGET_API_KEY" ]]; then
            echo "NUGET_API_KEY is required when publish is enabled." >&2
            exit 1
          fi

      - name: Publish to NuGet.org
        if: ${{ inputs.publish }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/packages/Auxim.Kernel.*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
