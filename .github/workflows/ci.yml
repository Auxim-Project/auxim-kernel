name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Auxim.Kernel.sln

      - name: Build
        run: dotnet build Auxim.Kernel.sln --no-restore -c Release

      - name: Test
        run: dotnet test Auxim.Kernel.sln --no-build -c Release --verbosity normal
